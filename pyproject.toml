[project]
name = "bet-ai"
version = "0.1.0"
description = "Análise de jogos de futebol ao vivo: captura odds de casas de apostas, modela probabilidades e compara com o mercado"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.69",
    "httpx>=0.27",
    "pydantic>=2.7",
    # CDNs de casas de apostas (Fastly, Cloudflare) servem Brotli e zstd. Sem
    # estes, o httpx anuncia só gzip/deflate e falha ao descomprimir a
    # resposta com "incorrect header check".
    "brotli>=1.1",
    "zstandard>=0.22",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
bet-ai = "betai.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/betai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
